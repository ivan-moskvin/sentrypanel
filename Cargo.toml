[package]
name = "sentrypanel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Key Sentry numbers on a screen of a Divoom Times Gate"
repository = "https://github.com/ivan-moskvin/sentrypanel"
license = "MIT"
publish = false

[[bin]]
name = "sentrypanel"
path = "src/main.rs"

[dependencies]
# Pinned to a tag, not a branch: a release must be reproducible, and a commit
# in the crate must not walk into the next build of this one on its own.
divoomkit = { git = "https://github.com/ivan-moskvin/divoomkit", tag = "v0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
ureq = { version = "3.3", features = ["json"] }
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"

[dev-dependencies]
tiny_http = "0.12"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
